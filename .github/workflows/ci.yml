name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-integrity-and-tests:
    name: Conflict Checks, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Check for Unresolved Merge Conflict Markers
        run: |
          echo "Scanning codebase for merge conflict markers (<<<<<<<, =======, >>>>>>>)..."
          if grep -rn --exclude-dir={node_modules,.git,dist,.expo,android} -E '^(<{7}|={7}|>{7})' .; then
            echo "❌ ERROR: Unresolved merge conflict markers detected in source files!"
            exit 1
          else
            echo "✅ PASS: No merge conflict markers found."
          fi

      - name: 2. Check for File Casing Collisions
        run: |
          echo "Checking for case-sensitivity filename collisions..."
          DUPLICATES=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "❌ ERROR: Case-insensitive filename collision detected:"
            echo "$DUPLICATES"
            exit 1
          else
            echo "✅ PASS: No filename casing conflicts."
          fi

      - name: 3. Validate Expo Configuration & Manifest
        run: npx expo config --type public

      - name: 4. Run TypeScript Type Check (Cross-File Type Integrity)
        run: npm run type-check

      - name: 5. Run Automated Logic Test Suite
        run: npm test
        env:
          CI: true
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY || 'mock_gemini_key_for_ci' }}
